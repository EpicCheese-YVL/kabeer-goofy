<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>kabeer goofy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #080010;
      --accent: #c840ff;
      --accent2: #ff2d6b;
      --white: #f0e8ff;
      --glow: rgba(200, 64, 255, 0.6);
      --glow2: rgba(255, 45, 107, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      width: 100vw;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--white);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      cursor: none;
    }

    /* CUSTOM CURSOR */
    .cursor {
      position: fixed;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--accent);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease, width 0.2s, height 0.2s, background 0.2s;
      mix-blend-mode: screen;
    }

    /* NOISE OVERLAY */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    /* ANIMATED BG BLOBS */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      pointer-events: none;
      animation: blobDrift 12s ease-in-out infinite alternate;
    }
    .blob1 { width: 500px; height: 500px; background: var(--accent); top: -150px; left: -150px; animation-delay: 0s; }
    .blob2 { width: 400px; height: 400px; background: var(--accent2); bottom: -100px; right: -100px; animation-delay: -4s; }
    .blob3 { width: 300px; height: 300px; background: #ff8c00; top: 50%; left: 50%; transform: translate(-50%,-50%); animation-delay: -8s; }

    @keyframes blobDrift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.1); }
    }

    /* SCREENS */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s ease;
      z-index: 1;
      padding: 20px;
    }

    .show {
      opacity: 1;
      pointer-events: auto;
    }

    /* START SCREEN */
    .eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-size: clamp(0.8rem, 2vw, 1rem);
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
      opacity: 0.9;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(4rem, 10vw, 8rem);
      letter-spacing: 4px;
      line-height: 0.9;
      background: linear-gradient(135deg, #fff 30%, var(--accent) 70%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      opacity: 0.55;
      margin-bottom: 50px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .start-btn {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 4px;
      padding: 18px 56px;
      border-radius: 4px;
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--white);
      cursor: none;
      position: relative;
      overflow: hidden;
      transition: color 0.3s ease;
    }

    .start-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.35s ease;
      z-index: -1;
    }

    .start-btn:hover::before { transform: scaleX(1); }
    .start-btn:hover { box-shadow: 0 0 40px var(--glow); }

    /* COUNT SCREEN */
    .count-label {
      font-family: 'DM Sans', sans-serif;
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      letter-spacing: 8px;
      text-transform: uppercase;
      opacity: 0.45;
      margin-bottom: 10px;
    }

    .number {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(10rem, 30vw, 22rem);
      line-height: 1;
      background: linear-gradient(135deg, #fff 20%, var(--accent) 60%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 40px rgba(200,64,255,0.5));
      animation: numPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes numPop {
      from { transform: scale(0.5) rotate(-5deg); opacity: 0; }
      to   { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    /* QUOTE SCREEN */
    .quote-wrapper {
      position: relative;
      max-width: 85vw;
    }

    .quote-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(6rem, 18vw, 12rem);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.04;
      pointer-events: none;
      color: var(--white);
    }

    .quote {
      font-family: 'DM Sans', sans-serif;
      font-size: clamp(1.6rem, 4.5vw, 3.2rem);
      font-weight: 900;
      line-height: 1.15;
      position: relative;
      z-index: 1;
      animation: quoteIn 0.5s cubic-bezier(0.34, 1.4, 0.64, 1) both;
    }

    @keyframes quoteIn {
      from { transform: translateY(30px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    .quote em {
      font-style: normal;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* PROGRESS BAR */
    .progress-bar {
      position: fixed;
      bottom: 0; left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.6s ease;
      z-index: 10;
    }

    /* END SCREEN */
    .end-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      letter-spacing: 3px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .end-sub {
      font-size: 0.95rem;
      opacity: 0.4;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 36px;
    }

    .promo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 24px;
      width: clamp(280px, 80vw, 360px);
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      text-decoration: none;
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
      box-shadow: 0 10px 40px var(--glow);
    }

    .icon { width: 36px; height: 36px; flex-shrink: 0; }
    .portfolio-icon { width: 40px; height: 40px; object-fit: contain; }

    .card-title { font-size: 1.2rem; font-weight: 900; }
    .card-desc { font-size: 0.88rem; opacity: 0.55; margin-top: 2px; }

    .github { border-left: 3px solid #9f7aea; }
    .portfolio { border-left: 3px solid var(--accent2); }

    /* SKIP HINT */
    .skip-hint {
      position: fixed;
      bottom: 24px;
      right: 24px;
      font-size: 0.7rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.2;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="progress-bar" id="progressBar" style="width:0%"></div>
  <div class="skip-hint"></div>

  <!-- START SCREEN -->
  <div id="startScreen" class="screen show">
    <div class="eyebrow">a public service announcement</div>
    <h1>Top 10 Reasons<br>Kabeer Is<br>Not Normal</h1>
    <div class="subtitle">Fully documented. Peer reviewed. Darsh approved.</div>
    <button id="startBtn" class="start-btn">EXPOSE HIM</button>
  </div>

  <!-- NUMBER SCREEN -->
  <div id="numberScreen" class="screen">
    <div class="count-label">Reason</div>
    <div id="number" class="number"></div>
  </div>

  <!-- QUOTE SCREEN -->
  <div id="quoteScreen" class="screen">
    <div class="quote-wrapper">
      <div id="quoteGhost" class="quote-num"></div>
      <div id="quote" class="quote"></div>
    </div>
  </div>

  <!-- END SCREEN -->
  <div id="endScreen" class="screen">
    <div class="end-title">Made by Veer .6</div>
    <div class="end-sub">Kabeer could not be reached for comment</div>
    <div class="promo">
      <a class="card github" href="https://github.com/vvyvl" target="_blank">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 .3a12 12 0 0 0-3.79 23.4c.6.11.82-.26.82-.58v-2.02c-3.34.73-4.04-1.61-4.04-1.61-.55-1.4-1.34-1.77-1.34-1.77-1.09-.75.08-.73.08-.73 1.2.08 1.83 1.24 1.83 1.24 1.07 1.83 2.8 1.3 3.48.99.11-.78.42-1.3.76-1.6-2.66-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.61-2.82 5.62-5.5 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.57A12 12 0 0 0 12 .3z"/>
        </svg>
        <div>
          <div class="card-title">GitHub</div>
          <div class="card-desc">My code & projects</div>
        </div>
      </a>
      <a class="card portfolio" href="https://vee-var.vercel.app/" target="_blank">
        <img src="https://www.katseye.world/wp-content/uploads/sites/2863/2025/04/cherry-red.png" class="icon portfolio-icon" alt="Portfolio icon">
        <div>
          <div class="card-title">Portfolio</div>
          <div class="card-desc">Everything I do is here</div>
        </div>
      </a>
    </div>
  </div>

  <script>
    // Custom cursor
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });

    // Reasons — formatted with **bold** markers parsed to <em>
    const reasons = [
      "His name sounds like **kebab**. He is literally named after street food.",
      "He cannot roast to save his life. Bro opens his mouth and just... nothing. Embarrassing.",
      "**Nothing he says makes sense.** It's like he speaks in a different language that doesn't exist.",
      "Total **teacher's pet** in English. Mrs Grandjean's little favourite. Tragic.",
      "His hair looks like a **full-grown bush**. Is it a hairstyle or a garden feature?",
      "Constantly boasting about being **one of few from Year 7/8**. Nobody asked. Nobody cared. Give it a rest.",
      "Doesn't even know his own birthday. Said **August 2010**, then admitted he was 14, then went \"nvm I calculated wrong... August 2011.\" Bro can't do basic maths on himself.",
      "Has the audacity to call YOU short when **you are literally older than him**. The irony is unreal.",
      "**Darsh** has confirmed — and we have no reason to doubt this — that Kabeer was made in a **test tube**. Science project gone wrong.",
      "Speaks with a full **American accent** despite being about as American as a Yorkshire pudding. AND sounds like a **robot** while doing it."
    ];

    const total = reasons.length;
    let current = total;
    let timeoutId = null;

    const screens = {
      start: document.getElementById("startScreen"),
      number: document.getElementById("numberScreen"),
      quote: document.getElementById("quoteScreen"),
      end: document.getElementById("endScreen")
    };

    const numberEl = document.getElementById("number");
    const quoteEl = document.getElementById("quote");
    const quoteGhost = document.getElementById("quoteGhost");
    const progressBar = document.getElementById("progressBar");

    function parseReason(text) {
      return text.replace(/\*\*(.*?)\*\*/g, '<em>$1</em>');
    }

    function updateProgress() {
      const done = total - current;
      progressBar.style.width = ((done / total) * 100) + '%';
    }

    function hideAll() {
      Object.values(screens).forEach(s => s.classList.remove("show"));
      if (timeoutId) clearTimeout(timeoutId);
    }

    function showNumber() {
      hideAll();
      numberEl.textContent = current;
      // Re-trigger animation
      numberEl.style.animation = 'none';
      void numberEl.offsetWidth;
      numberEl.style.animation = '';
      screens.number.classList.add("show");
      updateProgress();
      timeoutId = setTimeout(showQuote, 1800);
    }

    function showQuote() {
      hideAll();
      const reasonText = reasons[total - current];
      quoteEl.innerHTML = parseReason(reasonText);
      quoteGhost.textContent = current;
      // Re-trigger animation
      quoteEl.style.animation = 'none';
      void quoteEl.offsetWidth;
      quoteEl.style.animation = '';
      screens.quote.classList.add("show");
      timeoutId = setTimeout(() => {
        current--;
        current ? showNumber() : showEnd();
      }, 3500);
    }

    function showEnd() {
      hideAll();
      progressBar.style.width = '100%';
      screens.end.classList.add("show");
    }

    document.getElementById("startBtn").onclick = () => {
      current = total;
      progressBar.style.width = '0%';
      showNumber();
    };

    // Secret cheat code
    let secretCode = "";
    const codeWord = "end";
    document.addEventListener("keydown", (e) => {
      secretCode += e.key.toLowerCase();
      if (secretCode.length > codeWord.length) secretCode = secretCode.slice(-codeWord.length);
      if (secretCode === codeWord) {
        current = 0;
        if (timeoutId) clearTimeout(timeoutId);
        hideAll();
        progressBar.style.width = '100%';
        screens.end.classList.add("show");
      }
    });
  </script>
</body>
</html>
