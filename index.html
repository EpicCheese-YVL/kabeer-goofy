<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>kabeer goofy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      height: 100vh;
      width: 100vw;
      background: radial-gradient(circle at top, #1a0033, #000);
      font-family: Arial Black, Arial, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .show {
      opacity: 1;
      pointer-events: auto;
    }

    h1 {
      font-size: clamp(3rem, 7vw, 5rem);
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 30px rgba(200,120,255,0.8);
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      opacity: 0.75;
      margin-bottom: 50px;
      letter-spacing: 1px;
      text-shadow: 0 0 20px rgba(255,255,255,0.3);
    }

    .start-btn {
      font-size: 1.3rem;
      padding: 18px 46px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ffffff, #e0c7ff);
      box-shadow: 0 0 40px rgba(200,120,255,0.6), inset 0 0 10px rgba(255,255,255,0.6);
      border: none;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .start-btn:hover {
      transform: scale(1.12);
      box-shadow: 0 0 70px rgba(200,120,255,0.9), inset 0 0 12px rgba(255,255,255,0.8);
    }

    .number {
      font-size: clamp(8rem, 25vw, 18rem);
      font-weight: 900;
      text-shadow: 0 0 40px rgba(255,255,255,0.8), 0 0 80px rgba(255,0,200,0.8);
    }

    .quote {
      max-width: 80vw;
      font-size: clamp(2rem, 5vw, 3.5rem);
      padding: 0 5vw;
      line-height: 1.2;
    }

    .end-title {
      font-size: clamp(3rem, 6vw, 4.5rem);
      margin-bottom: 25px;
      text-shadow: 0 0 35px rgba(255,255,255,0.6);
    }

    .promo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      margin-top: 10px;
      text-align: center;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 20px 26px;
      max-width: 350px;
      width: 90%;
      background: rgba(255,255,255,0.08);
      border-radius: 18px;
      text-decoration: none;
      color: white;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 40px rgba(200,120,255,0.2);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 0 70px rgba(200,120,255,0.6);
    }

    .icon {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
    }

    .github-icon {
      color: white;
    }

    .portfolio-icon {
      width: 42px;
      height: 42px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(255, 0, 80, 0.6));
    }

    .title {
      font-size: 1.4rem;
      font-weight: 900;
    }

    .desc {
      font-size: 0.95rem;
      opacity: 0.75;
    }

    .github {
      border-left: 6px solid #9f7aea;
    }

    .portfolio {
      border-left: 6px solid #ff4d6d;
    }
  </style>
</head>
<body>

  <!-- START SCREEN -->
  <div id="startScreen" class="screen show intro">
    <h1>Top 5 Reasons</h1>
    <div class="subtitle">Why Kabeer Is Not Normal</div>
    <button id="startBtn" class="start-btn">Begin</button>
  </div>

  <!-- NUMBER SCREEN -->
  <div id="numberScreen" class="screen">
    <div id="number" class="number"></div>
  </div>

  <!-- QUOTE SCREEN -->
  <div id="quoteScreen" class="screen">
    <div id="quote" class="quote"></div>
  </div>

  <!-- END SCREEN -->
  <div id="endScreen" class="screen">
    <div class="end-title">Made by Veer .6</div>

    <div class="promo">
      <!-- GITHUB -->
      <a class="card github" href="https://github.com/EpicCheese-YVL" target="_blank">
        <svg class="icon github-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor"
            d="M12 .3a12 12 0 0 0-3.79 23.4c.6.11.82-.26.82-.58v-2.02c-3.34.73-4.04-1.61-4.04-1.61-.55-1.4-1.34-1.77-1.34-1.77-1.09-.75.08-.73.08-.73 1.2.08 1.83 1.24 1.83 1.24 1.07 1.83 2.8 1.3 3.48.99.11-.78.42-1.3.76-1.6-2.66-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.61-2.82 5.62-5.5 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.57A12 12 0 0 0 12 .3z" />
        </svg>
        <div>
          <div class="title">GitHub</div>
          <div class="desc">My code & projects</div>
        </div>
      </a>

      <!-- PORTFOLIO -->
      <a class="card portfolio" href="https://vee-var.vercel.app/" target="_blank">
        <img
          src="https://www.katseye.world/wp-content/uploads/sites/2863/2025/04/cherry-red.png"
          class="icon portfolio-icon"
          alt="Portfolio icon"
        >
        <div>
          <div class="title">Portfolio</div>
          <div class="desc">Everything I do is here</div>
        </div>
      </a>
    </div>
  </div>

  <script>
    const reasons = [
      "His name sounds like kebab",
      "He throws grapes at people",
      "He doesn't view Mrs Grandjean as his Mother",
      "goofy hair",
      "Has an american accent even though he is not american?"
    ];

    let current = reasons.length;
    let timeoutId = null; // track any running timeout

    const screens = {
      start: document.getElementById("startScreen"),
      number: document.getElementById("numberScreen"),
      quote: document.getElementById("quoteScreen"),
      end: document.getElementById("endScreen")
    };

    const numberEl = document.getElementById("number");
    const quoteEl = document.getElementById("quote");

    function hideAll() {
      Object.values(screens).forEach(s => s.classList.remove("show"));
      if (timeoutId) clearTimeout(timeoutId); // cancel any running timeout
    }

    function showNumber() {
      hideAll();
      numberEl.textContent = current;
      screens.number.classList.add("show");
      timeoutId = setTimeout(showQuote, 2000);
    }

    function showQuote() {
      hideAll();
      quoteEl.textContent = reasons[reasons.length - current];
      screens.quote.classList.add("show");
      timeoutId = setTimeout(() => {
        current--;
        current ? showNumber() : showEnd();
      }, 3000);
    }

    function showEnd() {
      hideAll();
      screens.end.classList.add("show");
    }

    document.getElementById("startBtn").onclick = () => {
      current = reasons.length; // reset
      showNumber();
    };

    // SECRET CHEAT CODE: type "end" to skip directly to end screen
    let secretCode = "";
    const codeWord = "end";

    document.addEventListener("keydown", (e) => {
      secretCode += e.key.toLowerCase();
      if (secretCode.length > codeWord.length) secretCode = secretCode.slice(-codeWord.length);

      if (secretCode === codeWord) {
        // cancel any running countdown and show end screen
        current = 0;
        if (timeoutId) clearTimeout(timeoutId);
        hideAll();
        screens.end.classList.add("show");
      }
    });
  </script>
</body>
</html>
